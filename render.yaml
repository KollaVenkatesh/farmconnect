services:
  - type: web
    name: farmconnect-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: "./farmconnect backend/Dockerfile"
    dockerContext: "./farmconnect backend"
    autoDeployTrigger: commit
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: farmconnect-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: farmconnect-frontend
    buildCommand: 'cd "farmconnect frontend" && npm ci && npm run build'
    staticPublishPath: "farmconnect frontend/dist"
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: farmconnect-backend
          envVarKey: RENDER_EXTERNAL_URL
